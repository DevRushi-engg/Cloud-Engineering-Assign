services:
  app:
    build: .
    ports:
      - "8082:3000"

    restart: unless-stopped

    environment:
      - APP_ENV=production
      - DB_HOST=db
      - DB_PORT=5432

    depends_on:
      - db

    mem_limit: 256m

  db:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
